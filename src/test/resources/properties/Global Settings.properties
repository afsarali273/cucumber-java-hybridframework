# ========================================================================================================
# QUALIFRAMEV2 - GLOBAL CONFIGURATION SETTINGS
# ========================================================================================================
# This file contains all configuration settings for the QualiFrameV2 test automation framework
# Mandatory fields are marked with (*)
# For detailed configuration examples, see: CONFIGURATION_GUIDE.md
# ========================================================================================================

# ========================================================================================================
# 1. CORE FRAMEWORK SETTINGS
# ========================================================================================================

# * ExecutionApproach: Test execution methodology
# Options: CUCUMBER (BDD), KEYWORD (Keyword-driven), MODULAR (Modular approach)
ExecutionApproach=CUCUMBER

# * AutomationFramework: Core automation technology
# Options: SELENIUM (Selenium WebDriver), PLAYWRIGHT (Microsoft Playwright)
AutomationFramework=SELENIUM

# * TestConfigurationID: Defines the execution environment and browser/device
# LOCAL WEB BROWSERS:
#   - LOCALChrome, LOCALFirefox, LOCALEdge, LOCALChrome_HEADLESS, LOCALChromeEmulation
# MOBILE TESTING:
#   - AppiumNativeAndroid, AppiumWebAndroid, AppiumNativeIOS, AppiumWebIOS
# CLOUD PLATFORMS:
#   - SauceLabs: SaucelabsWebChrome, SaucelabsWebFirefox, SaucelabsMobileAndroid, SaucelabsMobileIOS
#   - LambdaTest: LAMBDATESTWebChrome, LAMBDATESTWebFirefox, LAMBDATESTMobileAndroid, LAMBDATESTMobileIOS
#   - BrowserStack: BROWSERSTACKWebChrome, BROWSERSTACKWebFirefox, BROWSERSTACKMobileAndroid, BROWSERSTACKMobileIOS
#   - AWS Device Farm: AWSDEVICEFARMWebChrome, AWSDEVICEFARMWebFirefox, AWSDEVICEFARMWebEdge
# SPECIAL EXECUTION:
#   - WINDOWSEXECUTION (Windows applications), API (API testing only)
TestConfigurationID=LOCALChrome

# TestData: Data source for test inputs
# Options: EXCEL, CSV, JSON, ACCESSDB, MSSQL
TestData=EXCEL

# Application URLs for different environments
qaAppUrl=https://www.saucedemo.com/
prodAppUrl=https://www.saucedemo.com/
defaultEnvironment=qa

# Screenshot Configuration
TakeScreenshotFailedStep=True
TakeScreenshotPassedStep=True

# Element wait timeout in seconds
Timeout=50
# ========================================================================================================
# 2. CUCUMBER BDD SETTINGS
# ========================================================================================================

# SaveReports: Capture each execution report in separate timestamped folder
SaveReports=True

# Allure-Report: Enable Allure reporting integration
Allure-Report=False

# * DataTable: Test data file name (without extension)
# Options: WebModularScenario, MobileModularScenario, APIModularScenario
DataTable=WebModularScenario

# ========================================================================================================
# 3. REPORTING & EXECUTION SETTINGS
# ========================================================================================================

# Project identification
ProjectName=Sample Application
DateFormatString=dd-MMM-yyyy hh:mm:ss a

# Report configuration
TestNgReportPath=test-output
HtmlReport=True
IncludeTestDataInReport=False
ReportsTheme=CUSTOM

# Data management
DefaultDataSheet=General_Data
DataReferenceIdentifier=#

# Error handling: NEXT_TESTCASE, NEXT_ITERATION, STOP
OnError=NEXT_ITERATION

# Execution control
RunConfiguration=Regression
NumberOfThreads=1
ExecuteFlag=Yes
LogLevel=4

